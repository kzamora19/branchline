name: Unified SSO consent validation
on:
  push:
    branches: [feature/unified-sso-phase2-20261115]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check consent and existing login JS syntax
        run: |
          node --check auth-app.js
          node --check oauth-consent.js
          node --check oauth-redirect-policy.mjs
      - name: Run OAuth redirect security tests
        run: node --test tests/oauth-redirect.test.mjs
