name: PS awards validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'auth-app.js'
      - 'ps-certificates.mjs'
      - 'management-reports.mjs'
      - 'ptg-sales-insights.test.cjs'
      - 'supabase/functions/ptg-inventory/index.ts'
      - 'manager-attention.js'
      - 'manager-attention.test.cjs'
      - 'management-reports.test.cjs'
      - 'ps-certificates.test.cjs'
      - 'styles.css'
      - '.github/workflows/ps-awards-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-awards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test awards, management reports, integration and existing exports
        run: node --test ps-certificates.test.cjs management-reports.test.cjs manager-attention.test.cjs ptg-sales-insights.test.cjs exports.test.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check staged PTG inventory insights Edge Function
        run: deno check supabase/functions/ptg-inventory/index.ts
