name: Branchline application hub checks
on:
  push:
    branches:
      - main
      - feature/studio-apps-hub-20261119
    paths:
      - 'auth-app.js'
      - 'branchline-applications.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'tests/applications.test.mjs'
      - '.github/workflows/branchline-apps-ci.yml'
  pull_request:
    paths:
      - 'auth-app.js'
      - 'branchline-applications.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'tests/applications.test.mjs'
      - '.github/workflows/branchline-apps-ci.yml'
permissions:
  contents: read
jobs:
  app-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check auth-app.js
          node --check branchline-applications.js
          node --check sw.js
      - name: Verify application links, role navigation and offline cache
        run: node --test tests/applications.test.mjs
